<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL 翻訳ツール</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 700px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 1.8rem;
        }

        .upload-section {
            margin-bottom: 20px;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }

        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8ebff;
        }

        .upload-area p {
            color: #666;
            margin: 6px 0;
            font-size: 1rem;
        }

        #imageInput {
            display: none;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .language-select {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            min-width: 150px;
        }

        .translate-btn {
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .translate-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .translate-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .translate-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .preview {
            margin-bottom: 20px;
        }

        .preview img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .results {
            display: none;
            gap: 20px;
        }

        .results.show {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .result-box {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .result-box h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1rem;
        }

        .result-box p {
            color: #555;
            word-break: break-word;
            white-space: pre-wrap;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #fff0f0;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid #c33;
        }

        .error.show {
            display: block;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .results.show {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📸 SQL 翻訳ツール</h1>

        <div class="upload-section">
            <div class="upload-area" id="uploadArea">
                <p>📁 ここに画像をドラッグ＆ドロップ</p>
                <p>または クリックして選択</p>
                <input type="file" id="imageInput" accept="image/*">
            </div>
        </div>

        <div class="preview" id="preview"></div>

        <div class="controls">
            <select class="language-select" id="languageSelect">
                <option value="ja">日本語に翻訳</option>
                <option value="en">英語に翻訳</option>
            </select>
            <button class="translate-btn" id="translateBtn" disabled>翻訳する</button>
        </div>

        <div class="error" id="errorMsg"></div>
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>処理中...</p>
        </div>

        <div class="results" id="results">
            <div class="result-box">
                <h3>元のテキスト</h3>
                <p id="originalText"></p>
            </div>
            <div class="result-box">
                <h3>翻訳結果</h3>
                <p id="translatedText"></p>
            </div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const imageInput = document.getElementById('imageInput');
        const preview = document.getElementById('preview');
        const translateBtn = document.getElementById('translateBtn');
        const languageSelect = document.getElementById('languageSelect');
        const results = document.getElementById('results');
        const loading = document.getElementById('loading');
        const errorMsg = document.getElementById('errorMsg');

        let selectedFile = null;

        // ファイル選択イベント
        uploadArea.addEventListener('click', () => imageInput.click());

        imageInput.addEventListener('change', (e) => {
            handleFileSelect(e.target.files[0]);
        });

        // ドラッグ&ドロップ
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFileSelect(e.dataTransfer.files[0]);
        });

        function handleFileSelect(file) {
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                showError('画像ファイルを選択してください');
                return;
            }

            selectedFile = file;
            const reader = new FileReader();

            reader.onload = (e) => {
                preview.innerHTML = `<img src="${e.target.result}" alt="プレビュー">`;
                translateBtn.disabled = false;
                hideError();
            };

            reader.readAsDataURL(file);
        }

        // 翻訳実行
        translateBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('language', languageSelect.value);

            loading.classList.add('show');
            results.classList.remove('show');
            hideError();

            try {
                const response = await fetch('/api/translate-image', {
                    method: 'POST',
                    body: formData,
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || '翻訳に失敗しました');
                }

                const data = await response.json();

                document.getElementById('originalText').textContent = data.original;
                document.getElementById('translatedText').textContent = data.translated;

                results.classList.add('show');
            } catch (error) {
                showError(error.message);
            } finally {
                loading.classList.remove('show');
            }
        });

        function showError(message) {
            errorMsg.textContent = message;
            errorMsg.classList.add('show');
        }

        function hideError() {
            errorMsg.classList.remove('show');
        }
    </script>
</body>
</html>
